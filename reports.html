<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Reports — Clean Co</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- ── NAVIGATION ── -->
    <header class="site-header">
        <nav class="nav container">
            <a href="index.html" class="brand">
                <span class="logo">♻</span> Clean Co
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="report.html">Report</a></li>
                <li><a href="reports.html" class="active">Reports</a></li>
            </ul>
        </nav>
    </header>

    <!-- ── MAIN ── -->
    <main>
        <section class="container section">
            <div class="page-head-row">
                <div>
                    <h1>Community Reports</h1>
                    <p>Everything below is saved locally in your browser (localStorage).</p>
                </div>
                <a href="report.html" class="btn btn-primary">+ New Report</a>
            </div>

            <!-- Filters -->
            <div class="filters">
                <input id="search" type="search" placeholder="Search title, location, description…" />
                <select id="filter">
                    <option value="All">All</option>
                    <option value="Plastic">Plastic</option>
                    <option value="Organic">Organic</option>
                    <option value="E-Waste">E-Waste</option>
                    <option value="Hazardous">Hazardous</option>
                    <option value="General">General</option>
                </select>
            </div>

            <!-- Reports -->
            <div id="reports-list" class="cards-2"></div>

            <!-- Empty state -->
            <div id="empty" class="empty hidden">
                Nothing matches that.
                <a href="report.html">Be the first to report something →</a>
            </div>
        </section>
    </main>

    <!-- ── FOOTER ── -->
    <footer class="site-footer">
        <div class="container footer-grid">
            <p>© <span id="year"></span> Clean Co. Cleaner streets, greener future.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/reports.js"></script>

    <!-- Footer year -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const y = document.getElementById("year");
            if (y) y.textContent = new Date().getFullYear();
        });
    </script>
</body>

</html>
