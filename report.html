       <section class="container section narrow">
      <h1>Report a Waste Issue</h1>
      
        <form id="report-form" class="form" novalidate>
        <label>Title <span class="req">*</span>
          <input type="text" name="title" required minlength="3" />
          <small class="error" data-for="title"></small>
        </label>

        <label>Location <span class="req">*</span>
          <input type="text" name="location" required />
          <small class="error" data-for="location"></small>
        </label>

        <div class="row">
          <label>Category
            <select name="category">
              <option>General</option><option>Plastic</option><option>Organic</option>
              <option>E-Waste</option><option>Hazardous</option>
            </select>
          </label>
          <label>Urgency
            <select name="urgency">
              <option>Low</option><option selected>Medium</option><option>High</option>
            </select>
          </label>
        </div>

        <label>Description
          <textarea name="description" rows="4"></textarea>
        </label>

        <div class="row">
          <label>Your Name <span class="req">*</span>
            <input type="text" name="reporter" required />
            <small class="error" data-for="reporter"></small>
          </label>
          <label>Email <span class="req">*</span>
            <input type="email" name="email" required />
            <small class="error" data-for="email"></small>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Submit Report</button>
        <p id="success" class="success hidden">✅ Report submitted! Redirecting…</p>
      </form>
</body>
</html>
